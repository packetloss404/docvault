name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system packages
        run: |
          sudo apt-get update
          # libmagic1 backs python-magic, which replaces python-magic-bin off Windows
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng libmagic1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # test.txt carries pytest/pytest-django; dev.txt alone does not, so the
          # Test step below would fail with "No module named pytest".
          python -m pip install -r requirements/dev.txt -r requirements/test.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Production deploy checks
        run: python manage.py check --deploy --settings=docvault.settings.production
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production-with-enough-entropy-for-deploy-checks
          DATABASE_URL: sqlite:///db.sqlite3
          REDIS_URL: redis://localhost:6379
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
      - name: Test
        run: |
          set -o pipefail
          npm test -- --watch=false 2>&1 | tee test-output.txt
      # Vitest can fail to start a worker, skip those spec files, and still exit
      # 0 reporting the rest as passed. Compare the reported file count with the
      # number of spec files on disk so a partial run cannot look green.
      - name: Verify every spec file ran
        run: |
          expected=$(find src -name '*.spec.ts' | wc -l | tr -d '[:space:]')
          reported=$(sed -r 's/\x1B\[[0-9;]*[mGKH]//g' test-output.txt \
            | grep -oE 'Test Files[[:space:]]+[0-9]+ passed[[:space:]]*\([0-9]+\)' \
            | grep -oE '[0-9]+' | head -1)
          echo "spec files on disk: $expected; reported by vitest: ${reported:-none}"
          if [ "$expected" != "$reported" ]; then
            echo "::error::vitest reported ${reported:-no} spec files but $expected exist - a worker was likely skipped"
            exit 1
          fi
      - run: npm run build

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for integration images
        run: |
          df -h /
          du -sh /usr/local/lib/android /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: src-ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: src-ui
      - name: Exercise the production image with PostgreSQL, Redis and separate workers
        run: |
          docker build -t docvault:e2e-base .
          docker builder prune --all --force
          docker compose -f deploy/compose.e2e.yml --profile integrations build
          docker builder prune --all --force
          python deploy/e2e.py --integrations
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-browser-report
          path: |
            src-ui/playwright-report/
            src-ui/test-results/
          retention-days: 7

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Build Helm dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build deploy/helm/docvault
      - name: Lint Helm chart
        run: helm lint deploy/helm/docvault
      - name: Render Helm chart
        run: helm template docvault deploy/helm/docvault >/tmp/docvault-rendered.yaml
