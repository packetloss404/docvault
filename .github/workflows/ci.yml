name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Production deploy checks
        run: python manage.py check --deploy --settings=docvault.settings.production
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production-with-enough-entropy-for-deploy-checks
          DATABASE_URL: sqlite:///db.sqlite3
          REDIS_URL: redis://localhost:6379
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/docvault
      - name: Render Helm chart
        run: helm template docvault deploy/helm/docvault >/tmp/docvault-rendered.yaml
