apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docvault.fullname" . }}
  labels:
    {{- include "docvault.labels" . | nindent 4 }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ .Values.secretEnv.DJANGO_SECRET_KEY | default .Values.env.DJANGO_SECRET_KEY | b64enc | quote }}
  DATABASE_URL: {{ .Values.secretEnv.DATABASE_URL | default .Values.env.DATABASE_URL | default (include "docvault.databaseUrl" .) | b64enc | quote }}
  REDIS_URL: {{ .Values.secretEnv.REDIS_URL | default .Values.env.REDIS_URL | default (include "docvault.redisUrl" .) | b64enc | quote }}
  {{- range $key, $value := .Values.secretEnv }}
  {{- if and (ne $key "DJANGO_SECRET_KEY") (ne $key "DATABASE_URL") (ne $key "REDIS_URL") }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
